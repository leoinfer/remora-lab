[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remora-v0"
version = "0.1.0"
description = "Scratch-trained modular neural architecture research instrument"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.24", "safetensors>=0.4"]

[tool.setuptools.packages.find]
include = ["remora*"]
